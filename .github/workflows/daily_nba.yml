name: daily_nba

on:
  workflow_dispatch:
  schedule:
    # 台灣 18:30 (UTC+8) = UTC 10:30
    - cron: "30 10 * * *"

jobs:
  run-auto:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pytz requests nba_api psycopg2-binary scikit-learn

      - name: Run auto (sync + settle + train)
        env:
          # Supabase / DB
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}

          # Odds API (optional but recommended)
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

          # season (optional)
          NBA_SEASON: "2025-26"
        run: |
          python jobs/auto_nba_predict.py
