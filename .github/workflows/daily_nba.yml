name: daily_nba

on:
  workflow_dispatch:
    inputs:
      run:
        description: "preload | cache | sync | settle | train_base | train_cal | all"
        required: true
        default: "preload"
      verify_us_date:
        description: "Optional: override US date (MM/DD/YYYY)"
        required: false
        default: ""
      season:
        description: "Optional NBA season (e.g. 2025-26)"
        required: false
        default: "2025-26"
      cache_past_days:
        description: "Optional: cache past days window"
        required: false
        default: "14"
      cache_future_days:
        description: "Optional: cache future days window"
        required: false
        default: "7"
      backfill_past_days:
        description: "Optional: sync past days window"
        required: false
        default: "30"
      backfill_future_days:
        description: "Optional: sync future days window"
        required: false
        default: "2"
      settle_past_days:
        description: "Optional: settle past days window"
        required: false
        default: "180"
      base_min_rows:
        description: "Optional: min rows for train_base_model"
        required: false
        default: "200"
  schedule:
    # 10:30 UTC = 18:30 Asia/Taipei
    - cron: "30 10 * * *"

jobs:
  nba:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      NBA_SEASON: ${{ inputs.season || vars.NBA_SEASON || '2025-26' }}
      CACHE_PAST_DAYS: ${{ inputs.cache_past_days || vars.CACHE_PAST_DAYS || '14' }}
      CACHE_FUTURE_DAYS: ${{ inputs.cache_future_days || vars.CACHE_FUTURE_DAYS || '7' }}
      BACKFILL_PAST_DAYS: ${{ inputs.backfill_past_days || vars.BACKFILL_PAST_DAYS || '30' }}
      BACKFILL_FUTURE_DAYS: ${{ inputs.backfill_future_days || vars.BACKFILL_FUTURE_DAYS || '2' }}
      SETTLE_PAST_DAYS: ${{ inputs.settle_past_days || vars.SETTLE_PAST_DAYS || '180' }}
      BASE_MIN_ROWS: ${{ inputs.base_min_rows || vars.BASE_MIN_ROWS || '200' }}
      OVERRIDE_US_DATE: ${{ inputs.verify_us_date }}
      USE_ODDS: ${{ vars.USE_ODDS || '0' }}
      SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
      SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
      SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
      SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
      SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show resolved config
        run: |
          echo "event=${{ github.event_name }}"
          echo "run=${{ inputs.run || 'preload(schedule default)' }}"
          echo "season=${NBA_SEASON}"
          echo "cache_window=${CACHE_PAST_DAYS}/${CACHE_FUTURE_DAYS}"
          echo "backfill_window=${BACKFILL_PAST_DAYS}/${BACKFILL_FUTURE_DAYS}"
          echo "settle_past_days=${SETTLE_PAST_DAYS}"

      - name: Daily preload to DB
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.run == 'preload' || inputs.run == 'all')) }}
        run: |
          EXTRA_ARGS=""
          if [ "${USE_ODDS}" = "1" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --use-odds"
          fi
          python -u jobs/preload_nba_data.py \
            --season "${NBA_SEASON}" \
            --cache-past-days "${CACHE_PAST_DAYS}" \
            --cache-future-days "${CACHE_FUTURE_DAYS}" \
            --backfill-past-days "${BACKFILL_PAST_DAYS}" \
            --backfill-future-days "${BACKFILL_FUTURE_DAYS}" \
            --settle-past-days "${SETTLE_PAST_DAYS}" \
            $EXTRA_ARGS

      - name: Cache snapshots only
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.run == 'cache') }}
        run: |
          python -u -m jobs.cache_nba

      - name: Sync games only
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.run == 'sync') }}
        env:
          FAST_MODE: "0"
        run: |
          python -u -m jobs.sync_daily

      - name: Settle results only
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.run == 'settle') }}
        run: |
          python -u -m jobs.settle_daily

      - name: Train base model
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.run == 'train_base' || inputs.run == 'all') }}
        run: |
          python -u -m jobs.cache_boxscore
          python -u -m jobs.rebuild_features_from_boxscore
          python -u -m jobs.fill_b2b_nulls
          python -u -m jobs.train_base_model

      - name: Train calibrator
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.run == 'train_cal' || inputs.run == 'all') }}
        run: |
          python -u -m jobs.train_calibrator
