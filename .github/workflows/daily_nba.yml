name: daily_nba

on:
  workflow_dispatch:
    inputs:
      run:
        description: >-
          legacy: preload | cache | sync | settle | train_base | all —
          v2: v2_daily | v2_schema | v2_backfill | v2_ingest | v2_lines |
          v2_injuries | v2_predict | v2_settle | v2_train | v2_diagnose |
          v2_evaluate | v2_quality | backup_legacy
        required: true
        default: "v2_daily"
      season:
        description: "NBA season (e.g. 2026-27)"
        required: false
        default: "2026-27"
      seasons:
        description: "v2_backfill: comma-separated seasons (ESPN)"
        required: false
        default: "2026-27"
      verify_us_date:
        description: "legacy: override US date (MM/DD/YYYY)"
        required: false
        default: ""
      cache_past_days:
        description: "legacy: cache past days window"
        required: false
        default: "14"
      cache_future_days:
        description: "legacy: cache future days window"
        required: false
        default: "7"
      backfill_past_days:
        description: "legacy: sync past days window"
        required: false
        default: "30"
      backfill_future_days:
        description: "legacy: sync future days window"
        required: false
        default: "2"
      settle_past_days:
        description: "legacy: settle past days window"
        required: false
        default: "180"
      base_min_rows:
        description: "legacy: min rows for train_base_model"
        required: false
        default: "200"
  schedule:
    # 07:00 UTC (15:00 Taipei) — v2 full daily run: the day's official prediction. GitHub starts
    # scheduled runs 3-4 h late on this repo (the 10:30 UTC cron ran at 14:05 and 14:32 UTC on
    # 10/24-25), so it is set early enough that a late start still lands before 21:00 Taipei.
    # The latest NBA games end about 04:30-05:00 UTC (EDT) or 05:30-06:00 UTC (EST), so
    # 07:00 UTC leaves an hour for ESPN to mark them final.
    - cron: "0 7 * * *"
    # Close snapshots (lines + injuries for games tipping off within ~2.5 h; no prediction).
    # 22:30 / 00:30 / 02:00 UTC cover 7, 8 and 10 pm ET tipoffs in both EDT and EST.
    - cron: "30 22 * * *"
    - cron: "30 0 * * *"
    - cron: "0 2 * * *"
    # Monday 12:00 UTC — weekly v2 retrain (no-ops below MIN_TRAIN_ROWS) + keepalive
    - cron: "0 12 * * 1"

concurrency:
  group: daily-nba
  cancel-in-progress: false

jobs:
  nba:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      NBA_SEASON: ${{ inputs.season || vars.NBA_SEASON || '2026-27' }}
      CACHE_PAST_DAYS: ${{ inputs.cache_past_days || vars.CACHE_PAST_DAYS || '14' }}
      CACHE_FUTURE_DAYS: ${{ inputs.cache_future_days || vars.CACHE_FUTURE_DAYS || '7' }}
      BACKFILL_PAST_DAYS: ${{ inputs.backfill_past_days || vars.BACKFILL_PAST_DAYS || '30' }}
      BACKFILL_FUTURE_DAYS: ${{ inputs.backfill_future_days || vars.BACKFILL_FUTURE_DAYS || '2' }}
      SETTLE_PAST_DAYS: ${{ inputs.settle_past_days || vars.SETTLE_PAST_DAYS || '180' }}
      BASE_MIN_ROWS: ${{ inputs.base_min_rows || vars.BASE_MIN_ROWS || '200' }}
      OVERRIDE_US_DATE: ${{ inputs.verify_us_date }}
      USE_ODDS: ${{ vars.USE_ODDS || '0' }}
      # Predictions stay paper until the model is shown to beat the market (P5).
      PAPER_MODE: "1"
      SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
      SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
      SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
      SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
      SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show resolved config
        run: |
          echo "event=${{ github.event_name }} schedule=${{ github.event.schedule }}"
          echo "run=${{ inputs.run || '(schedule)' }}"
          echo "season=${NBA_SEASON}"

      # ---------- legacy pipeline (parallel-run period; removed at cutover) ----------

      - name: Legacy daily preload to DB
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.run == 'preload' || inputs.run == 'all') }}
        run: |
          EXTRA_ARGS=""
          if [ "${USE_ODDS}" = "1" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --use-odds"
          fi
          python -u jobs/preload_nba_data.py \
            --season "${NBA_SEASON}" \
            --cache-past-days "${CACHE_PAST_DAYS}" \
            --cache-future-days "${CACHE_FUTURE_DAYS}" \
            --backfill-past-days "${BACKFILL_PAST_DAYS}" \
            --backfill-future-days "${BACKFILL_FUTURE_DAYS}" \
            --settle-past-days "${SETTLE_PAST_DAYS}" \
            $EXTRA_ARGS

      - name: Legacy cache snapshots only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run == 'cache' }}
        run: python -u -m jobs.cache_nba

      - name: Legacy sync games only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run == 'sync' }}
        env:
          FAST_MODE: "0"
        run: python -u -m jobs.sync_daily

      - name: Legacy settle results only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run == 'settle' }}
        run: python -u -m jobs.settle_daily

      - name: Legacy train base model
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run == 'train_base' }}
        run: |
          python -u -m jobs.cache_boxscore
          python -u -m jobs.rebuild_features_from_boxscore
          python -u -m jobs.fill_b2b_nulls
          python -u -m jobs.train_base_model

      # NOTE: the legacy "train_cal" step was removed deliberately — it
      # overwrote cover_prob_calibrator with a wrong-scale isotonic and broke
      # the app's calibration whenever it ran.

      # ---------- v2 pipeline ----------

      - name: v2 schema
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run == 'v2_schema' }}
        run: python -u -m jobs.schema

      - name: v2 backup legacy lines (CSV artifact)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run == 'backup_legacy' }}
        run: python -u -m jobs.export_legacy_csv --out games_legacy_backup.csv

      - name: Upload legacy backup artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run == 'backup_legacy' }}
        uses: actions/upload-artifact@v4
        with:
          name: games-legacy-backup
          path: games_legacy_backup.csv
          retention-days: 90

      - name: v2 historical backfill
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run == 'v2_backfill' }}
        run: python -u -m jobs.ingest_espn --seasons "${{ inputs.seasons }}"

      - name: v2 daily pipeline
        if: ${{ github.event.schedule == '0 7 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.run == 'v2_daily' || inputs.run == 'all')) }}
        run: python -u -m jobs.run_daily

      # Separate step so a data-quality failure and an ingest failure are two distinct red
      # steps. !cancelled() (not always()) so it still runs after run_daily fails but stops
      # when the run is cancelled. Preseason is skipped: the model never uses it and its
      # one-off gaps would otherwise turn CI red for a week at the start of every season.
      - name: v2 quality (read-only data checks)
        if: ${{ !cancelled() && github.event.schedule == '0 7 * * *' }}
        run: python -u -m jobs.quality --since 7d --fail-on warn --ignore-types preseason

      - name: v2 quality (manual, full run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run == 'v2_quality' }}
        run: python -u -m jobs.quality --all --fail-on warn

      - name: v2 ingest only (ESPN games + box scores)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run == 'v2_ingest' }}
        run: python -u -m jobs.ingest_espn --days-back 3

      - name: v2 close snapshot
        if: ${{ github.event.schedule == '30 22 * * *' || github.event.schedule == '30 0 * * *' || github.event.schedule == '0 2 * * *' || (github.event_name == 'workflow_dispatch' && inputs.run == 'v2_lines') }}
        run: python -u -m jobs.run_daily --close

      - name: v2 injuries only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run == 'v2_injuries' }}
        run: python -u -m jobs.snapshot_injuries

      - name: v2 predict only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run == 'v2_predict' }}
        run: python -u -m jobs.predict_daily

      - name: v2 settle only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run == 'v2_settle' }}
        run: python -u -m jobs.settle

      - name: v2 train + calibrate
        if: ${{ github.event.schedule == '0 12 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.run == 'v2_train') }}
        run: |
          python -u -m jobs.train
          python -u -m jobs.calibrate

      - name: v2 diagnose (read-only DB state check)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run == 'v2_diagnose' }}
        run: python -u -m jobs.diagnose

      - name: v2 evaluate (walk-forward + ATS ROI backtest)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run == 'v2_evaluate' }}
        run: python -u -m jobs.evaluate

  # Re-enables this workflow weekly so GitHub's 60-day inactivity rule does not
  # silently stop the schedule. Whether re-enabling resets that timer is NOT
  # documented by GitHub (unverified); the site's staleness notice is the alarm.
  keepalive:
    if: ${{ github.event.schedule == '0 12 * * 1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-enable daily_nba
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily_nba.yml/enable"
