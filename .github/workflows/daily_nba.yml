name: daily_nba

on:
  workflow_dispatch:
    inputs:
      run:
        description: "cache | sync | settle | train_base | train_cal | all"
        required: true
        default: "all"
      verify_us_date:
        description: "Optional: override US date (MM/DD/YYYY)"
        required: false
        default: ""
      season:
        description: "Optional NBA season (e.g. 2025-26)"
        required: false
        default: "2025-26"
  schedule:
    - cron: "30 10 * * *"

jobs:
  nba:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NBA_SEASON: ${{ inputs.season || vars.NBA_SEASON || '2025-26' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show dispatch inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "run=${{ inputs.run }}"
          echo "verify_us_date=${{ inputs.verify_us_date }}"
          echo "season=${{ inputs.season }}"
          echo "NBA_SEASON(resolved)=${NBA_SEASON}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =====================
      # CACHE (nba_api snapshots)
      # =====================
      - name: Cache nba_api snapshots
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.run == 'cache' || inputs.run == 'all')) }}
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
          OVERRIDE_US_DATE: ${{ inputs.verify_us_date }}
          CACHE_PAST_DAYS: "7"
          CACHE_FUTURE_DAYS: "7"
        run: |
          python -u jobs/cache_nba.py

      # =====================
      # SYNC
      # =====================
      - name: Sync games
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.run == 'sync' || inputs.run == 'all')) }}
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          OVERRIDE_US_DATE: ${{ inputs.verify_us_date }}
          FAST_MODE: "0"
          BACKFILL_PAST_DAYS: "7"
          BACKFILL_FUTURE_DAYS: "7"
          PROB_SCALE: "12"
          PROB_FLOOR: "0.12"
          PROB_CEIL: "0.88"
        run: |
          python -u jobs/sync_daily.py

      # =====================
      # SETTLE
      # =====================
      - name: Settle results
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.run == 'settle' || inputs.run == 'all')) }}
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
          OVERRIDE_US_DATE: ${{ inputs.verify_us_date }}
        run: |
          python -u jobs/settle_daily.py

      # =====================
      # TRAIN BASE (margin model)
      # =====================
      - name: Train base model
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.run == 'train_base' || inputs.run == 'all')) }}
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
        run: |
          python -u jobs/train_base_model.py

      # =====================
      # TRAIN CALIBRATOR
      # =====================
      - name: Train calibrator
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.run == 'train_cal' || inputs.run == 'all')) }}
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
        run: |
          python -u jobs/train_calibrator.py
