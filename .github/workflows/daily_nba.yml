name: daily_nba

on:
  workflow_dispatch:
    inputs:
      run:
        description: "cache | sync | settle | train | all"
        required: true
        default: "all"
      verify_us_date:
        description: "Optional: override US date (MM/DD/YYYY)"
        required: false
        default: ""
  schedule:
    - cron: "30 10 * * *"

jobs:
  nba:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas pytz requests psycopg2-binary scikit-learn nba_api beautifulsoup4 lxml

      # =====================
      # CACHE (nba_api -> Supabase public.nba_cache)
      # =====================
      - name: Cache NBA data (hardened)
        if: ${{ github.event_name == 'schedule' ||
                github.event.inputs.run == 'cache' ||
                github.event.inputs.run == 'all' }}
        env:
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
          NBA_SEASON: "2025-26"
          # Optional: align anchor day for cache with manual sync override
          OVERRIDE_US_DATE: ${{ github.event.inputs.verify_us_date }}

          # nba_api anti-hang
          NBA_API_TIMEOUT_S: "10"
          NBA_API_RETRIES: "1"

          # team_ctx anti-hang (total time budget)
          TEAM_CTX_DEADLINE_S: "180"
          TEAM_CTX_BATCH_SIZE: "10"
          TEAM_CTX_MAX_TEAMS: "30"

          # all | players | team_ctx
          CACHE_MODE: "all"
        run: |
          python jobs/cache_nba_data.py

      # =====================
      # SYNC (cache-first, no nba_api)
      # =====================
      - name: Sync games (cache-first)
        if: ${{ github.event_name == 'schedule' ||
                github.event.inputs.run == 'sync' ||
                github.event.inputs.run == 'all' }}
        env:
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

          NBA_SEASON: "2025-26"
          OVERRIDE_US_DATE: ${{ github.event.inputs.verify_us_date }}

          FAST_MODE: "0"
          BACKFILL_PAST_DAYS: "7"
          BACKFILL_FUTURE_DAYS: "7"

          PROB_SCALE: "12"
          PROB_FLOOR: "0.12"
          PROB_CEIL: "0.88"
        run: |
          python jobs/sync_daily.py

      # =====================
      # SETTLE
      # =====================
      - name: Settle results
        if: ${{ github.event_name == 'schedule' ||
                github.event.inputs.run == 'settle' ||
                github.event.inputs.run == 'all' }}
        env:
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
          OVERRIDE_US_DATE: ${{ github.event.inputs.verify_us_date }}
        run: |
          python jobs/settle_daily.py

      # =====================
      # TRAIN (calibrator)
      # =====================
      - name: Train calibrator
        if: ${{ github.event_name == 'schedule' ||
                github.event.inputs.run == 'train' ||
                github.event.inputs.run == 'all' }}
        env:
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
        run: |
          python jobs/train_calibrator.py
