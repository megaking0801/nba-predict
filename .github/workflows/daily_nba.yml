name: daily_nba

on:
  workflow_dispatch:
    inputs:
      run:
        description: "cache | sync | settle | train_base | train_cal | all"
        required: true
        default: "all"
      verify_us_date:
        description: "Optional: override US date (MM/DD/YYYY)"
        required: false
        default: ""
  schedule:
    - cron: "30 10 * * *"  # UTC 10:30 = Taiwan 18:30

jobs:
  nba:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas pytz requests psycopg2-binary scikit-learn nba_api beautifulsoup4 lxml

      # =====================
      # CACHE (nba_api -> nba_cache)
      # =====================
      - name: Cache NBA data (hardened)
        if: ${{ github.event_name == 'schedule' ||
                github.event.inputs.run == 'cache' ||
                github.event.inputs.run == 'all' }}
        env:
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
          NBA_SEASON: "2025-26"
          OVERRIDE_US_DATE: ${{ github.event.inputs.verify_us_date }}

          NBA_API_TIMEOUT_S: "10"
          NBA_API_RETRIES: "1"

          TEAM_CTX_DEADLINE_S: "180"
          TEAM_CTX_BATCH_SIZE: "10"
          TEAM_CTX_MAX_TEAMS: "30"

          CACHE_MODE: "all"
        run: |
          python jobs/cache_nba_data.py

      # =====================
      # SYNC (cache-first)
      # =====================
      - name: Sync games
        if: ${{ github.event_name == 'schedule' ||
                github.event.inputs.run == 'sync' ||
                github.event.inputs.run == 'all' }}
        env:
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NBA_SEASON: "2025-26"
          OVERRIDE_US_DATE: ${{ github.event.inputs.verify_us_date }}

          FAST_MODE: "0"
          BACKFILL_PAST_DAYS: "7"
          BACKFILL_FUTURE_DAYS: "7"

          PROB_SCALE: "12"
          PROB_FLOOR: "0.12"
          PROB_CEIL: "0.88"
        run: |
          python jobs/sync_daily.py

      # =====================
      # SETTLE (writes cover + margin)
      # =====================
      - name: Settle results
        if: ${{ github.event_name == 'schedule' ||
                github.event.inputs.run == 'settle' ||
                github.event.inputs.run == 'all' }}
        env:
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
          OVERRIDE_US_DATE: ${{ github.event.inputs.verify_us_date }}
          SETTLE_PAST_DAYS: "14"
        run: |
          python jobs/settle_daily.py

      # =====================
      # TRAIN BASE MODEL (GBM margin regression)
      # =====================
      - name: Train base model (margin)
        if: ${{ github.event_name == 'schedule' ||
                github.event.inputs.run == 'train_base' ||
                github.event.inputs.run == 'all' }}
        env:
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
          BASE_MIN_ROWS: "200"
          BASE_MAX_ROWS: "5000"
        run: |
          python jobs/train_base_model.py

      # =====================
      # TRAIN CALIBRATOR (f_edge -> cover_prob)
      # =====================
      - name: Train calibrator
        if: ${{ github.event_name == 'schedule' ||
                github.event.inputs.run == 'train_cal' ||
                github.event.inputs.run == 'all' }}
        env:
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
          CAL_MIN_ROWS: "200"
          CAL_MAX_ROWS: "10000"
        run: |
          python jobs/train_calibrator.py
