name: daily_nba

on:
  workflow_dispatch:
    inputs:
      run:
        description: "cache | sync | settle | train_base | train_cal | all"
        required: true
        default: "all"
      verify_us_date:
        description: "Optional: override US date (MM/DD/YYYY)"
        required: false
        default: ""
      season:
        description: "Optional NBA season (e.g. 2025-26)"
        required: false
        default: "2025-26"
  schedule:
    - cron: "30 10 * * *"

jobs:
  nba:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NBA_SEASON: ${{ inputs.season || vars.NBA_SEASON || '2025-26' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show dispatch inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "run=${{ inputs.run }}"
          echo "verify_us_date=${{ inputs.verify_us_date }}"
          echo "season=${{ inputs.season }}"
          echo "NBA_SEASON(resolved)=${NBA_SEASON}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =====================
      # CACHE (nba_api snapshots)
      # =====================
      - name: Cache nba_api snapshots
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.run == 'cache' || inputs.run == 'all')) }}
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
          OVERRIDE_US_DATE: ${{ inputs.verify_us_date }}
          CACHE_PAST_DAYS: "7"
          CACHE_FUTURE_DAYS: "7"
        run: |
          python -u -m jobs.cache_nba

      # =====================
      # SYNC
      # =====================
      - name: Debug sync module version
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.run == 'sync' || inputs.run == 'all')) }}
        run: |
          git rev-parse --short HEAD
          python - <<'PY2'
          import inspect
          import jobs.sync_daily as s
          print('sync_daily_file=', s.__file__)
          print('upsert_games_line=', inspect.getsourcelines(s.upsert_games)[1])
          print('upsert_includes_home_b2b=', 'home_b2b' in s.UPSERT_COLUMNS and 'home_b2b' in s.UPSERT_SQL)
          print('upsert_includes_away_b2b=', 'away_b2b' in s.UPSERT_COLUMNS and 'away_b2b' in s.UPSERT_SQL)
          print('uses_execute_batch_for_b2b=', 'execute_batch' in inspect.getsource(s.upsert_games))
          PY2

      - name: Check sync env presence
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.run == 'sync' || inputs.run == 'all')) }}
        env:
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python - <<'PY2'
          import os
          keys = [
              'SUPABASE_HOST','SUPABASE_DB','SUPABASE_USER','SUPABASE_PASSWORD','SUPABASE_PORT','ODDS_API_KEY'
          ]
          for k in keys:
              print(f"{k}={'set' if bool((os.getenv(k) or '').strip()) else 'missing'}")
          PY2

      - name: Sync games
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.run == 'sync' || inputs.run == 'all')) }}
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          OVERRIDE_US_DATE: ${{ inputs.verify_us_date }}
          FAST_MODE: "0"
          BACKFILL_PAST_DAYS: "7"
          BACKFILL_FUTURE_DAYS: "7"
          PROB_SCALE: "12"
          PROB_FLOOR: "0.12"
          PROB_CEIL: "0.88"
        run: |
          python -u -m jobs.sync_daily

      # =====================
      # SETTLE
      # =====================
      - name: Settle results
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.run == 'settle' || inputs.run == 'all')) }}
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
          OVERRIDE_US_DATE: ${{ inputs.verify_us_date }}
        run: |
          python -u -m jobs.settle_daily

      # =====================
      # TRAIN BASE (margin model)
      # =====================
      - name: Train base model
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.run == 'train_base' || inputs.run == 'all')) }}
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
        run: |
          python -u -m jobs.train_base_model

      # =====================
      # TRAIN CALIBRATOR
      # =====================
      - name: Train calibrator
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.run == 'train_cal' || inputs.run == 'all')) }}
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
        run: |
          python -u -m jobs.train_calibrator
