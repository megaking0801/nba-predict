name: daily_nba

on:
  workflow_dispatch:
    inputs:
      run:
        description: "sync | settle | train_base | train_cal | train_all | sync_settle | sync_train_all | settle_train_all | all"
        required: true
        default: "all"
      verify_us_date:
        description: "Optional: override US date (MM/DD/YYYY)"
        required: false
        default: ""
  schedule:
    - cron: "30 10 * * *"

jobs:
  nba:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas pytz requests psycopg2-binary scikit-learn nba_api

      # =====================
      # SYNC
      # =====================
      - name: Sync games
        if: ${{ github.event_name == 'schedule' ||
                github.event.inputs.run == 'sync' ||
                github.event.inputs.run == 'sync_settle' ||
                github.event.inputs.run == 'sync_train_all' ||
                github.event.inputs.run == 'all' }}
        env:
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NBA_SEASON: "2025-26"
          OVERRIDE_US_DATE: ${{ github.event.inputs.verify_us_date }}
          BACKFILL_PAST_DAYS: "7"
          BACKFILL_FUTURE_DAYS: "7"
        run: |
          python jobs/sync_daily.py

      # =====================
      # SETTLE
      # =====================
      - name: Settle results
        if: ${{ github.event_name == 'schedule' ||
                github.event.inputs.run == 'settle' ||
                github.event.inputs.run == 'sync_settle' ||
                github.event.inputs.run == 'settle_train_all' ||
                github.event.inputs.run == 'all' }}
        env:
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
          OVERRIDE_US_DATE: ${{ github.event.inputs.verify_us_date }}
        run: |
          python jobs/settle_daily.py

      # =====================
      # TRAIN (BASE MODEL)
      # =====================
      - name: Train base model
        if: ${{ github.event_name == 'schedule' ||
                github.event.inputs.run == 'train_base' ||
                github.event.inputs.run == 'train_all' ||
                github.event.inputs.run == 'train' ||
                github.event.inputs.run == 'sync_train_all' ||
                github.event.inputs.run == 'settle_train_all' ||
                github.event.inputs.run == 'all' }}
        env:
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
        run: |
          python jobs/train_base_model.py

      # =====================
      # TRAIN (CALIBRATOR)
      # =====================
      - name: Train calibrator
        if: ${{ github.event_name == 'schedule' ||
                github.event.inputs.run == 'train_cal' ||
                github.event.inputs.run == 'train_all' ||
                github.event.inputs.run == 'train' ||
                github.event.inputs.run == 'sync_train_all' ||
                github.event.inputs.run == 'settle_train_all' ||
                github.event.inputs.run == 'all' }}
        env:
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
        run: |
          python jobs/train_calibrator.py
